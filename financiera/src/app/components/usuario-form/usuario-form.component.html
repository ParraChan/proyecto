<form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">

                
    <h3> Formato para {{(usuario.id_usuario)? 'Actualizar': 'Crear'}} </h3>
    <input placeholder="nombre"
    name="nombre"
    [(ngModel)]="usuario.nombre"
    class="form-control my-2"
    required>

    <input placeholder="apellido paterno"
    name="apellido_paterno"
    [(ngModel)]="usuario.apellido_paterno"
    class="form-control my-2"
    required>

    <input placeholder="apellido materno"
    name="apellido_materno"
    [(ngModel)]="usuario.apellido_materno"
    class="form-control my-2"
    required>

    <input placeholder="fecha de nacimiento"
    name="fecha_nacimiento"
    [(ngModel)]="usuario.fecha_nacimiento"
    class="form-control my-2"
    required>

    <input placeholder="fecha de ingreso"
    name="ingresos_mensuales"
    [(ngModel)]="usuario.fecha_ingreso"
    class="form-control my-2"
    required>
    
    <select [(ngModel)]="usuario.puesto" name="puesto" id="rol" class="form-control my-2" required>
    <option [ngValue]="null" disabled selected>Seleccione un rol</option>
    <option *ngFor="let rol of roles" [ngValue]="rol">{{ rol.nombre_rol }}</option>
    </select>

    <div>
        <button type="submit" class="btn btn-primary m-2"
        [disabled]="userForm.invalid">
                {{(usuario.id_usuario)? 'Actualizar': 'Crear'}}
        </button>
        <button class="btn btn-secondary my-2"
        (click)="onClear(userForm)" 
        >
            Limpiar
        </button>

    </div>

</form>
