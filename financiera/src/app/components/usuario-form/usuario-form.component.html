<div class="card w-50">
  <div class="card-content">
    <div class="card-header">
      <h5 class="card-title">
        Formato para
        {{ usuario.idUsuario > 0 ? "actualizar" : "crear" }}
      </h5>
    </div>
    <div class="card-body">
      <ng-container *ngIf="authService.rol === 'ROLE_SUPERVISOR'; else noAccess">
        <form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">

          <div class="mb-3 row align-items-center">
            <label for="nombre" class="col-sm-4 col-form-label">Nombre</label>
            <div class="col-sm-8">
              <input
                id="nombre"
                placeholder="Nombre"
                name="nombre"
                [(ngModel)]="usuario.nombre"
                class="form-control"
                required
              />
              <div class="text-danger" *ngIf="errors?.nombre">{{ errors.nombre }}</div>
            </div>
          </div>

          <div class="mb-3 row align-items-center">
            <label for="apellido_paterno" class="col-sm-4 col-form-label">Apellido Paterno</label>
            <div class="col-sm-8">
              <input
                id="apellido_paterno"
                placeholder="Apellido Paterno"
                name="apellido_paterno"
                [(ngModel)]="usuario.apellido_paterno"
                class="form-control"
                required
              />
              <div class="text-danger" *ngIf="errors?.apellido_paterno">{{ errors.apellido_paterno }}</div>
            </div>
          </div>

          <div class="mb-3 row align-items-center">
            <label for="apellido_materno" class="col-sm-4 col-form-label">Apellido Materno</label>
            <div class="col-sm-8">
              <input
                id="apellido_materno"
                placeholder="Apellido Materno"
                name="apellido_materno"
                [(ngModel)]="usuario.apellido_materno"
                class="form-control"
                required
              />
              <div class="text-danger" *ngIf="errors?.apellido_materno">{{ errors.apellido_materno }}</div>
            </div>
          </div>

          <div class="mb-3 row align-items-center">
            <label for="fecha_nacimiento" class="col-sm-4 col-form-label">Fecha de Nacimiento</label>
            <div class="col-sm-8">
              <input
                id="fecha_nacimiento"
                type="date"
                name="fecha_nacimiento"
                [(ngModel)]="usuario.fecha_nacimiento"
                class="form-control"
                [max]="maxDate"
                required
              />
              <div class="text-danger" *ngIf="errors?.fecha_nacimiento">{{ errors.fecha_nacimiento }}</div>
            </div>
          </div>

          <div class="mb-3 row align-items-center">
            <label for="fecha_ingreso" class="col-sm-4 col-form-label">Fecha de Ingreso</label>
            <div class="col-sm-8">
              <input
                id="fecha_ingreso"
                type="date"
                name="fecha_ingreso"
                [(ngModel)]="usuario.fecha_ingreso"
                class="form-control"
                required
              />
              <div class="text-danger" *ngIf="errors?.fecha_ingreso">{{ errors.fecha_ingreso }}</div>
            </div>
          </div>

          <div class="mb-3 row align-items-center">
            <label for="rol" class="col-sm-4 col-form-label">Rol</label>
            <div class="col-sm-8">
              <select
                id="rol"
                name="puesto"
                [(ngModel)]="usuario.puesto"
                class="form-control"
                required
              >
                <option [ngValue]="null" disabled selected>Seleccione un rol</option>
                <option *ngFor="let rol of roles" [ngValue]="rol">{{ rol.nombre_rol }}</option>
              </select>
            </div>
          </div>

          <ng-container *ngIf="usuario.idUsuario === 0">
            <div class="mb-3 row align-items-center">
              <label for="nombreusuario" class="col-sm-4 col-form-label">Nombre de Usuario</label>
              <div class="col-sm-8">
                <input
                  id="nombreusuario"
                  placeholder="Nombre de usuario"
                  name="nombreusuario"
                  [(ngModel)]="usuario.nombreusuario"
                  class="form-control"
                  required
                />
                <div *ngIf="errors?.nombreusuario" class="text-danger">{{ errors.nombreusuario }}</div>
              </div>
            </div>

            <div class="mb-3 row align-items-center">
              <label for="contrasena" class="col-sm-4 col-form-label">Contraseña</label>
              <div class="col-sm-8">
                <input
                  id="contrasena"
                  placeholder="Contraseña"
                  name="contrasena"
                  type="password"
                  [(ngModel)]="usuario.contrasena"
                  class="form-control"
                  required
                />
                <div *ngIf="errors?.contrasena" class="text-danger">{{ errors.contrasena }}</div>
              </div>
            </div>
          </ng-container>

          <div class="mb-3 row">
            <div class="offset-sm-4 col-sm-8">
              <button
                type="submit"
                class="btn btn-primary me-2"
                [disabled]="userForm.invalid"
              >
                {{ usuario.idUsuario ? "Actualizar" : "Crear" }}
              </button>
              <button type="button" class="btn btn-danger" (click)="onClear(userForm)">
                Cancelar
              </button>
            </div>
          </div>

        </form>
      </ng-container>

      <ng-template #noAccess>
        <div class="alert alert-warning">No tienes acceso a este recurso</div>
      </ng-template>
    </div>
  </div>
</div>
